name: Build high-resolution Tuval Cam favicons

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-favicons.yml"
      - "scripts/build_favicons.py"
      - "favicon.svg"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tuvalcam-favicon-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install rasterization tools
        run: python -m pip install --quiet "Pillow>=11.0" "CairoSVG>=2.7"
      - name: Rebuild accessible favicon image set
        run: python scripts/build_favicons.py
      - name: Commit raster icons to website repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.ico favicon-48x48.png favicon-96x96.png favicon-192x192.png favicon-512x512.png apple-touch-icon.png
          if git diff --cached --quiet; then
            echo "Favicons are already current"
          else
            git commit -m "Provide high resolution Google-ready Tuval Cam favicon set"
            git push origin HEAD:main
          fi
